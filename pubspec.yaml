name: dashboard_kpi

description: ERP Travel Umroh & Muslim Friendly Platform

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ===========================
  # UI
  # ===========================
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  flutter_staggered_grid_view: ^0.7.0

  # ===========================
  # Navigation
  # ===========================
  go_router: ^16.2.0

  # ===========================
  # State Management
  # ===========================
  flutter_riverpod: ^3.0.3

  # ===========================
  # Dependency Injection
  # ===========================
  get_it: ^8.2.0

  # ===========================
  # Local Storage
  # ===========================
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # ===========================
  # API
  # ===========================
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # ===========================
  # Serialization
  # ===========================
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ===========================
  # Image Picker
  # ===========================
  image_picker: ^1.2.0

  # ===========================
  # Permission
  # ===========================
  permission_handler: ^12.0.1

  # ===========================
  # URL Launcher
  # ===========================
  url_launcher: ^6.3.2

  # ===========================
  # Maps
  # ===========================
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2

  # ===========================
  # QR
  # ===========================
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # ===========================
  # Date
  # ===========================
  intl: ^0.20.2

  # ===========================
  # Charts
  # ===========================
  fl_chart: ^1.1.1

  # ===========================
  # Animation
  # ===========================
  lottie: ^3.3.2

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.7.1

  freezed: ^3.2.3

  json_serializable: ^6.11.1

flutter:

  uses-material-design: true

  assets:

    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/logo/

  fonts:

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400

        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500

        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800